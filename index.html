<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="심사 결과 공개 페이지">
  <title>Judging Results</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="page-shell">
    <header class="hero">
      <div class="hero__eyebrow">OFFICIAL RESULTS</div>
      <h1 id="eventTitle">Judging Results</h1>
      <p id="eventSubtitle" class="hero__subtitle">심사 결과를 불러오는 중입니다.</p>
    </header>

    <main>
      <section class="toolbar" aria-label="결과 필터">
        <div class="filter-stack">
          <div class="filter-row">
            <span class="filter-label">ROUND</span>
            <div id="roundFilters" class="segmented"></div>
          </div>

          <div id="groupFilterRow" class="filter-row">
            <span class="filter-label">GROUP</span>
            <div id="groupFilters" class="segmented"></div>
          </div>

          <div id="judgeFilterRow" class="filter-row">
            <span class="filter-label">RANKING</span>
            <div id="judgeFilters" class="segmented"></div>
          </div>
        </div>

        <label class="search">
          <span class="sr-only">참가자 검색</span>
          <input id="searchInput" type="search" placeholder="참가자 검색" autocomplete="off">
        </label>
      </section>

      <section class="summary-grid">
        <article class="summary-card summary-card--participants">
          <span id="summaryLabel1">Participants</span>
          <strong id="summaryValue1">-</strong>
        </article>

        <article class="summary-card summary-card--judges">
          <span id="summaryLabel2">Judges</span>
          <strong id="summaryValue2">-</strong>
        </article>

        <article class="summary-card summary-card--scoring">
          <span id="summaryLabel3">Scoring</span>
          <strong id="summaryValue3">-</strong>
        </article>
      </section>

      <section class="results-section">
        <div class="section-heading">
          <div>
            <p class="section-kicker">RANKING</p>
            <h2 id="rankingTitle">Final Results</h2>
          </div>
          <p id="updatedAt" class="updated-at"></p>
        </div>

        <div class="table-wrap">
          <table class="results-table">
            <thead id="resultsHead"></thead>
            <tbody id="resultsBody"></tbody>
          </table>
        </div>

        <div id="emptyState" class="empty-state" hidden>
          표시할 결과가 없습니다.
        </div>
      </section>

      <section id="subcategorySection" class="subcategory-section" hidden>
        <div class="section-heading">
          <div>
            <p class="section-kicker">SPECIAL AWARDS</p>
            <h2>Subcategory Winners</h2>
          </div>
          <p id="subcategoryMethod" class="updated-at"></p>
        </div>

        <div id="subcategoryGrid" class="subcategory-grid"></div>
      </section>

      <section class="method-section">
        <div>
          <p class="section-kicker">SCORING METHOD</p>
          <h2 id="methodHeading">평가 방식</h2>
        </div>
        <div id="methodGrid" class="method-grid"></div>
      </section>
    </main>
  </div>

  <dialog id="detailDialog" class="detail-dialog">
    <button id="dialogClose" class="dialog-close" type="button" aria-label="닫기">×</button>
    <div id="detailContent"></div>
  </dialog>

  <div id="loading" class="loading">
    <div class="spinner"></div>
    <p>결과를 불러오는 중입니다.</p>
  </div>

  <script src="./app.js"></script>
</body>
</html>
